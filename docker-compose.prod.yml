services:
  mongo:
    image: mongo:7
    command: ["--auth", "--wiredTigerCacheSizeGB", "0.75", "--quiet"]
    attach: false
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:?Set MONGO_APP_USERNAME in .env}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD in .env}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-dago}
    volumes:
      - mongo_data:/data/db
      - ./init.js:/docker-entrypoint-initdb.d/init.js:ro
    networks:
      - app-internal
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet -u \"$${MONGO_INITDB_ROOT_USERNAME}\" -p \"$${MONGO_INITDB_ROOT_PASSWORD}\" --eval 'db.runCommand({ ping: 1 }).ok' | grep 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  cpp-backend:
    build:
      context: ./app/cpp-backend
      dockerfile: Dockerfile
    expose:
      - "30311"
    volumes:
      - ./app/proto:/proto:ro
    networks:
      - app-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/30311'"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s

  python-backend:
    build:
      context: ./app
      dockerfile: ./python-backend/Dockerfile
    environment:
      MONGODB_URI: mongodb://${MONGO_APP_USERNAME:?Set MONGO_APP_USERNAME in .env}:${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD in .env}@mongo:27017/${MONGO_DB_NAME:-dago}?authSource=${MONGO_DB_NAME:-dago}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-dago}
      SERVICE_IP_ADDRESS: 0.0.0.0
      SERVICE_PORT: 30301
      LAYOUT_SERVICE_IP_ADDRESS: cpp-backend
      LAYOUT_SERVICE_PORT: 30311
      MAX_CONTENT_LENGTH_MB: ${MAX_CONTENT_LENGTH_MB:-100}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-1}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-1200}
    expose:
      - "30301"
    networks:
      - app-internal
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      cpp-backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import socket; s=socket.create_connection(('127.0.0.1', 30301), 5); s.close()\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 40s

  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile.prod
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      - public
      - app-internal
    restart: unless-stopped
    depends_on:
      python-backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1/ || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  public:
  app-internal:
    internal: true

volumes:
  mongo_data:
